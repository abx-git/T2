# Statische App nach gh-pages — nicht README aus main/ rendern.
# GitHub: Settings → Pages → Source: Deploy from branch → gh-pages → / (root)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /T2

      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
          single-commit: true
          commit-message: "Deploy T2 app"
